name: FWA Atmospheric regional historical snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fwa-atmospheric-regional.yml'
      - 'src/fwa_atmospheric_regional.py'
permissions:
  contents: write
concurrency:
  group: fwa-atmospheric-regional
  cancel-in-progress: false
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt eccodes eccodeslib pyproj 'dynamical-catalog>=1,<2'
      - run: python -m py_compile src/fwa_atmospheric_regional.py
      - run: python src/fwa_atmospheric_regional.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwa-atmospheric-regional-historical
          path: outputs/atmospheric-regional/
          retention-days: 90
      - name: Record regional evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("outputs/atmospheric-regional/status.json")
          d=json.loads(p.read_text()) if p.exists() else {"status":"failed_before_download"}
          d.update(job_status=os.environ["JOB_STATUS"],run_url=os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],commit=os.environ["GITHUB_SHA"])
          pathlib.Path("regional-receipt.json").write_text(json.dumps(d,indent=2))
          PY
          URL="repos/$GITHUB_REPOSITORY/contents/ops/fwa_atmospheric_regional.json"
          SHA="$(gh api "$URL" --jq .sha 2>/dev/null || true)"
          args=()
          if [ -n "$SHA" ]; then args+=(-f "sha=$SHA"); fi
          gh api --method PUT "$URL" -f message="Record regional historical atmospheric evidence" -f content="$(base64 -w0 regional-receipt.json)" "${args[@]}"
