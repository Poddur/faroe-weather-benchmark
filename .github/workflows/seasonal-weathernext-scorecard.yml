name: Publish research report from seasonal WeatherNext archive

on:
  workflow_run:
    workflows: ["Seasonal historical WeatherNext 3 evaluation - 2026"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: seasonal-weathernext-scorecard
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download published verified historical dataset
        run: |
          mkdir -p outputs/seasonal-report
          gh release download weathernext3-seasonal-2026 --pattern 'weathernext3-seasonal-2026.zip' --dir outputs/seasonal-report
          cd outputs/seasonal-report
          unzip -q weathernext3-seasonal-2026.zip
      - name: Compute stratified observational errors and issue-cluster uncertainty
        run: python src/report_historical_weathernext.py --root outputs/seasonal-report
      - name: Archive human-readable report and tables
        run: |
          set -euo pipefail
          (cd outputs/seasonal-report && zip -q ../../weathernext3-2026-research-scorecard.zip RESEARCH_REPORT.md scorecard_by_lead.csv scorecard_by_station.csv scorecard_by_month.csv confidence_intervals.csv)
          gh release upload weathernext3-seasonal-2026 weathernext3-2026-research-scorecard.zip --clobber
      - name: Publish verified scorecard status
        run: |
          python - <<'PY'
          import json,pathlib,os
          root=pathlib.Path("outputs/seasonal-report")
          manifest=json.loads((root/"manifest.json").read_text())
          m={"status":"verified","issue_times":manifest["independent_init_times"],
             "forecast_rows":manifest["forecast_rows"],"observation_rows":manifest["observation_rows"],
             "paired_rows":manifest["paired_rows"],
             "source_release":"weathernext3-seasonal-2026",
             "scorecard_release_asset":"weathernext3-2026-research-scorecard.zip",
             "report_run_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
             "interpretation":"Retrospective WeatherNext3 vs DMI only, not three-model comparison."}
          pathlib.Path("report_status.json").write_text(json.dumps(m,indent=2)+"\n")
          PY
          B64="$(base64 -w0 report_status.json)"
          URL="repos/$GITHUB_REPOSITORY/contents/ops/weathernext_seasonal_scorecard.json"
          SHA="$(gh api "$URL" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$URL" -f message="Record verified seasonal WeatherNext scorecard" -f content="$B64" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$URL" -f message="Record verified seasonal WeatherNext scorecard" -f content="$B64" >/dev/null
          fi
      - name: Preserve scorecard audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-weathernext-report
          path: |
            outputs/seasonal-report/RESEARCH_REPORT.md
            outputs/seasonal-report/scorecard_by_lead.csv
            outputs/seasonal-report/scorecard_by_station.csv
            outputs/seasonal-report/scorecard_by_month.csv
            outputs/seasonal-report/confidence_intervals.csv
          retention-days: 90
      - name: Track scoring errors
        if: failure()
        run: |
          set +e
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --title "WeatherNext seasonal research scorecard failed" --body "Report generation failed: $URL. Consult Actions artifact."
