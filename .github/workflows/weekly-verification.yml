name: Weekly Weather Forecast Verification

on:
  push:
    paths:
      - '.github/workflows/weekly-verification.yml'
  schedule:
    - cron: '43 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-weekly-evaluation
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download recent weekly releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundles
          gh release list --limit 6 --json tagName --jq '.[].tagName' | grep '^weather-data-' | while read -r TAG; do
            mkdir -p "release-bundles/$TAG"
            gh release download "$TAG" --pattern 'issue_*.zip' --dir "release-bundles/$TAG" || true
          done
          find release-bundles -type f -name 'issue_*.zip' | wc -l
      - name: Evaluate only valid contemporaneously archived forecast pairs
        run: python src/evaluate_releases.py --archive-dir release-bundles --output outputs/report
      - name: Archive report with weekly source data release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          TAG="weather-data-$(date -u +%G-W%V)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ARCHIVE="verification-report-$(date -u +%G-W%V).zip"
            ( cd outputs/report && zip -qr "../../$ARCHIVE" . )
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            echo "No current-week weather data release, report remains an Actions artifact."
          fi
      - name: Publish weekly evaluation heartbeat
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime,pathlib
          status=json.load(open('outputs/report/report.json'))
          status.update(
            updated_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
            workflow_run_url=os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          )
          pathlib.Path('report_status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          B64="$(base64 -w0 report_status.json)"
          PATH_URL="repos/$GITHUB_REPOSITORY/contents/ops/latest_weekly_analysis.json"
          SHA="$(gh api "$PATH_URL" --jq .sha 2>/dev/null || true)"
          if [ -z "$SHA" ]; then
            gh api --method PUT "$PATH_URL" -f message="Record latest weekly model evaluation" -f content="$B64" >/dev/null
          else
            gh api --method PUT "$PATH_URL" -f message="Record latest weekly model evaluation" -f content="$B64" -f sha="$SHA" >/dev/null
          fi
      - name: Retain report in workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-model-verification
          path: outputs/report/
          retention-days: 90
