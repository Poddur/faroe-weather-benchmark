name: Operational Faroese Weather Archive

on:
  push:
    paths:
      - '.github/workflows/operational-archive.yml'
  schedule:
    - cron: '27 4,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-operational-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verified weather dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'ecmwf-opendata>=0.3,<1' 'xarray>=2024.1' 'cfgrib>=0.9.10' 'eccodes>=2.35'
      - name: Unit tests, fail closed
        run: python -m pytest -q
      - name: Collect contemporary matching issue and immutable raw GRIB
        run: python src/collect_matched_forecasts.py --output outputs/operational/forecast
      - name: Collect up to 90 hours of real DMI observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/operational/observations
          END="$(date -u '+%Y-%m-%dT%H:00:00Z')"
          START="$(date -u -d '90 hours ago' '+%Y-%m-%dT%H:00:00Z')"
          echo "Observation interval: $START ... $END"
          python src/fetch_dmi_observations.py \
            --station-ids 06009 06011 06014 \
            --start "$START" --end "$END" \
            --variables temp_dry wind_speed \
            --output outputs/operational/observations/observations.csv
      - name: Verify hashes, pairing, timestamps and observation keys
        run: python src/verify_operational.py --root outputs/operational
      - name: Record code revision and create bounded archive
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('outputs/operational')
          m=json.loads((root/'forecast/manifest.json').read_text())
          (root/'collection_provenance.json').write_text(json.dumps({
            'repository':os.environ['GITHUB_REPOSITORY'],
            'commit_sha':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'issue_time_utc':m['issue_time_utc'],
            'licence_attribution':['DMI Open Data','ECMWF IFS Open Data CC BY 4.0']
          },indent=2)+'\n')
          PY
          ISSUE="$(python -c "import json;print(json.load(open('outputs/operational/forecast/manifest.json'))['issue_time_utc'])")"
          STEM="issue_${ISSUE//[:\-]/}"
          STEM="${STEM//T/_}"
          STEM="${STEM//Z/UTC}"
          ARCHIVE="${STEM}.zip"
          ( cd outputs/operational && zip -qr "../../${ARCHIVE}" . )
          BYTES="$(stat -c '%s' "$ARCHIVE")"
          test "$BYTES" -gt 1000
          test "$BYTES" -lt 30000000 || { echo "Archive exceeds 30MB guard"; exit 1; }
          TAG="weather-data-$(date -u +%G-W%V)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Created ${ARCHIVE}, ${BYTES} bytes, release ${TAG}"
      - name: Publish long-lived archive to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.bundle.outputs.tag }}"
          ARCHIVE="${{ steps.bundle.outputs.archive }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Weather data archive $TAG" \
              --notes "Research archive of UTC forecast issues, ECMWF IFS and DMI HARMONIE DINI raw files, and DMI observations. ECMWF data attribution: ECMWF Open Data (CC BY 4.0). DMI data attribution: DMI Open Data. Forecast skill is not asserted by these unverified model outputs." \
              --latest=false
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber
          echo "Published $ARCHIVE to release $TAG"
      - name: Upload audit bundle to Actions for short-term redundancy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-cycle-audit
          path: outputs/operational/
          if-no-files-found: warn
          retention-days: 30
