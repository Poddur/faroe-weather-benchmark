name: Operational Faroese Weather Archive

on:
  push:
    paths:
      - '.github/workflows/operational-archive.yml'
      - 'src/collect_matched_forecasts.py'
      - 'src/fetch_dmi_observations.py'
      - 'src/verify_operational.py'
  schedule:
    - cron: '27 4,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weather-operational-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verified weather dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'ecmwf-opendata>=0.3,<1' 'xarray>=2024.1' 'cfgrib>=0.9.10' 'eccodes>=2.35'
      - name: Unit tests, fail closed
        run: python -m pytest -q
      - name: Collect contemporary matching issue and immutable raw GRIB
        run: python src/collect_matched_forecasts.py --output outputs/operational/forecast
      - name: Collect up to 90 hours of real DMI observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/operational/observations
          END="$(date -u '+%Y-%m-%dT%H:00:00Z')"
          START="$(date -u -d '90 hours ago' '+%Y-%m-%dT%H:00:00Z')"
          echo "Observation interval: $START ... $END"
          python src/fetch_dmi_observations.py \
            --station-ids 06009 06011 06014 \
            --start "$START" --end "$END" \
            --variables temp_dry wind_speed \
            --output outputs/operational/observations/observations.csv
      - name: Verify hashes, pairing, timestamps and observation keys
        run: python src/verify_operational.py --root outputs/operational
      - name: Record code revision and create bounded archive
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('outputs/operational')
          m=json.loads((root/'forecast/manifest.json').read_text())
          (root/'collection_provenance.json').write_text(json.dumps({
            'repository':os.environ['GITHUB_REPOSITORY'],
            'commit_sha':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'issue_time_utc':m['issue_time_utc'],
            'licence_attribution':['DMI Open Data','ECMWF IFS Open Data CC BY 4.0']
          },indent=2)+'\n')
          PY
          ISSUE="$(python -c "import json;print(json.load(open('outputs/operational/forecast/manifest.json'))['issue_time_utc'])")"
          STEM="issue_${ISSUE//[:\-]/}"
          STEM="${STEM//T/_}"
          STEM="${STEM//Z/UTC}"
          ARCHIVE="${STEM}.zip"
          ( cd outputs/operational && zip -qr "../../${ARCHIVE}" . )
          BYTES="$(stat -c '%s' "$ARCHIVE")"
          test "$BYTES" -gt 1000
          test "$BYTES" -lt 30000000 || { echo "Archive exceeds 30MB guard"; exit 1; }
          TAG="weather-data-$(date -u +%G-W%V)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Created ${ARCHIVE}, ${BYTES} bytes, release ${TAG}"
      - name: Publish long-lived archive to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.bundle.outputs.tag }}"
          ARCHIVE="${{ steps.bundle.outputs.archive }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Weather data archive $TAG" \
              --notes "Research archive of UTC forecast issues, ECMWF IFS and DMI HARMONIE DINI raw files, and DMI observations. ECMWF data attribution: ECMWF Open Data (CC BY 4.0). DMI data attribution: DMI Open Data. Forecast skill is not asserted by these unverified model outputs." \
              --latest=false
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber
          echo "Published $ARCHIVE to release $TAG"
      - name: Update persistent operational status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,datetime,pathlib
          m=json.load(open('outputs/operational/forecast/manifest.json'))
          v=json.load(open('outputs/operational/verification.json'))
          status={
            'updated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'state':'success',
            'issue_time_utc':m['issue_time_utc'],
            'source_models':['ECMWF_IFS','HARMONIE_DINI'],
            'forecast_rows':v['forecast_rows'],
            'observation_rows':v['observation_rows'],
            'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'source_commit':os.environ['GITHUB_SHA'],
            'archive_tag':'weather-data-'+datetime.datetime.now(datetime.timezone.utc).strftime('%G-W%V')
          }
          pathlib.Path('status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          B64="$(base64 -w0 status.json)"
          PATH_URL="repos/$GITHUB_REPOSITORY/contents/ops/latest_success.json"
          SHA="$(gh api "$PATH_URL" --jq .sha 2>/dev/null || true)"
          if [ -z "$SHA" ]; then
            gh api --method PUT "$PATH_URL" -f message="Update successful weather archive heartbeat" -f content="$B64" >/dev/null
          else
            gh api --method PUT "$PATH_URL" -f message="Update successful weather archive heartbeat" -f content="$B64" -f sha="$SHA" >/dev/null
          fi
      - name: Report source or archive failures in a single tracked issue
        if: failure()
        shell: bash
        run: |
          set +e
          TITLE="Automated weather archive failure"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Automatic collection failed: $URL. Review the workflow artifact and source logs."
          else
            gh issue create --title "$TITLE" --body "Automatic collection failed: $URL. Check ECMWF/DMI source availability, exact issue selection and archived diagnostics. This tracker is used for operational failures, not evidence of forecast quality."
          fi
      - name: Upload audit bundle to Actions for short-term redundancy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-cycle-audit
          path: outputs/operational/
          if-no-files-found: warn
          retention-days: 30
