name: FWA locked winter validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fwa-winter.yml'
  schedule:
    - cron: '37 9 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: fwa-winter-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'dynamical-catalog>=1,<2' scikit-learn rasterio pyproj
      - name: Verify frozen model through historical replay
        run: |
          gh run download 44718559350 -n fwa-confirmatory-evidence -D replay-evidence
          python src/fwa5_winter.py --replay replay-evidence
      - uses: actions/cache/restore@v4
        with:
          path: winter-cache
          key: fwa-winter-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fwa-winter-v1-
      - name: Restore immutable winter evidence from durable GitHub Release
        run: |
          set -euo pipefail
          TAG="fwa-winter-locked-2026-2027"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSET=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[] | select(.name | startswith("fwa-winter-checkpoints-"))] | sort_by(.created_at) | last | .name // empty')
            if [ -n "$ASSET" ]; then
              mkdir -p durable-recovery
              gh release download "$TAG" --pattern "$ASSET" --dir durable-recovery
              python src/fwa_winter_restore.py --cache winter-cache --archive "durable-recovery/$ASSET"
            else
              echo "No durable winter snapshot yet"
            fi
          else
            echo "Durable winter release not created before first eligible issue"
          fi
      - name: Recover durable checkpoints when cache is absent or empty
        run: |
          set -euo pipefail
          mkdir -p winter-cache
          # An empty restored directory is NOT evidence that any issue was saved.
          if ! find winter-cache -maxdepth 1 -type f -name '????????.json' -print -quit | grep -q .; then
            RUN=$(gh run list --workflow fwa-winter.yml --status completed --limit 100 --json databaseId --jq '.[].databaseId' | while read -r id; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name=="fwa-winter-checkpoints" and .expired==false) | .id' | grep -q .; then echo "$id"; break; fi
            done)
            if [ -n "$RUN" ]; then
              gh run download "$RUN" -n fwa-winter-checkpoints -D winter-cache
              echo "Recovered FWA winter checkpoint archive from run $RUN"
            else
              echo "No previous durable winter checkpoint artifact exists"
            fi
          else
            echo "Existing winter issue checkpoints found; keeping them unchanged"
          fi
      - name: Validate locked models on eligible winter archive dates
        timeout-minutes: 145
        run: python src/fwa5_winter.py
      - name: Score frozen FWA2 and FWA4A against all three reference models
        if: success()
        run: python src/fwa_locked_reference_scorecard.py --cache winter-cache --out outputs/fwa-winter/frozen_reference_scorecard.json
      - name: Preserve immutable winter checkpoint snapshot beyond Actions artifact expiry
        if: success()
        run: |
          set -euo pipefail
          if ! find winter-cache -maxdepth 1 -type f -name '????????.json' -print -quit | grep -q .; then
            echo "No eligible checkpoint manifests; skip durable snapshot"
            exit 0
          fi
          TAG="fwa-winter-locked-2026-2027"
          ARCHIVE="fwa-winter-checkpoints-${GITHUB_RUN_ID}.zip"
          zip -qr "$ARCHIVE" winter-cache
          python - "$ARCHIVE" <<'PY'
          import pathlib,sys,zipfile
          p=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'Invalid durable archive'
              assert any(x.startswith('winter-cache/') and x.endswith('.json') for x in z.namelist())
          PY
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Frozen FWA winter validation evidence 2026–2027" --latest=false --notes "Immutable per-run snapshots of locked FWA2/FWA4A/FWA5 validation checkpoints. Historical exact-run model sources, not live issuance. Scientific skill must be evaluated from paired observations and independent model days."
          fi
          gh release upload "$TAG" "$ARCHIVE"
          echo "Durable independent evidence snapshot: $TAG/$ARCHIVE"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: winter-cache
          key: fwa-winter-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwa-winter-checkpoints
          path: winter-cache/
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwa-winter-evidence
          path: outputs/fwa-winter/
          retention-days: 90
      - name: Persist scientific status receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("outputs/fwa-winter/status.json")
          d=json.loads(p.read_text()) if p.exists() else {"status":"failed_before_evaluation"}
          d.update(job_status=os.environ["JOB_STATUS"],run_url=os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],commit=os.environ["GITHUB_SHA"])
          pathlib.Path("winter-receipt.json").write_text(json.dumps(d,indent=2))
          PY
          URL="repos/$GITHUB_REPOSITORY/contents/ops/fwa_winter.json"
          SHA="$(gh api "$URL" --jq .sha 2>/dev/null || true)"
          args=()
          if [ -n "$SHA" ]; then args+=(-f "sha=$SHA"); fi
          gh api --method PUT "$URL" -f message="Record locked winter validation status" -f content="$(base64 -w0 winter-receipt.json)" "${args[@]}"
