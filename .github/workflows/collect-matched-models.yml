name: Collect matching ECMWF + DINI issue (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "ecmwf-opendata>=0.3,<1" "xarray>=2024.1" "cfgrib>=0.9.10" "eccodes>=2.35"
      - name: Test issue-selection and unit conversions
        run: python -m pytest -q tests/test_matched_collector.py
      - name: Retrieve matched 00/12 UTC model issue
        run: python src/collect_matched_forecasts.py --output outputs/matched
      - name: Preserve raw source bytes and provenance even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-ecmwf-harmonie-raw-forecasts
          path: outputs/matched/
          retention-days: 14
