name: FWA historical model research pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fwa-historical-pilot.yml'
      - 'src/fwa_historical_pilot.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fwa-historical-pilot
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'dynamical-catalog>=1,<2'
      - run: python -m pytest -q
      - name: Restore validated historical station responses
        uses: actions/cache/restore@v4
        with:
          path: fwa-cache
          key: fwa-station-v1-${{ github.run_id }}
          restore-keys: fwa-station-v1-
      - name: Recover previously downloaded verified raw responses
        run: |
          mkdir -p recovery/first recovery/second fwa-cache
          gh run download 44593999138 -n fwa-research-evidence -D recovery/first
          gh run download 44603896069 -n fwa-research-evidence -D recovery/second
          python - <<'PY'
          import json,pathlib,urllib.parse
          stations={"06009":(61.3957,-6.6818),"06011":(62.0231,-6.7647),"06014":(62.2995,-7.074)}
          count=0
          for folder in ("first","second"):
              for p in pathlib.Path("recovery",folder).rglob("open_meteo_raw.json"):
                  for item in json.loads(p.read_text()):
                      u=urllib.parse.urlparse(item["url"])
                      q=urllib.parse.parse_qs(u.query)
                      if u.hostname!="single-runs-api.open-meteo.com" or q.get("models")!=["ecmwf_ifs,dmi_harmonie_arome_europe"]:continue
                      if q.get("hourly")!=["temperature_2m,wind_speed_10m"] or q.get("wind_speed_unit")!=["ms"] or q.get("cell_selection")!=["nearest"] or q.get("elevation")!=["nan"]:continue
                      lat,lon=float(q["latitude"][0]),float(q["longitude"][0])
                      sid=next((k for k,(a,b) in stations.items() if abs(a-lat)<1e-8 and abs(b-lon)<1e-8),None)
                      if sid is None:continue
                      day=q["run"][0][:10].replace("-","")
                      dest=pathlib.Path("fwa-cache",day+"_"+sid+".json")
                      if not dest.exists():
                          dest.write_text(json.dumps(item));count+=1
          print("Recovered station responses:",count)
          PY
      - name: Run bounded historical access and held-out scoring experiment
        run: python src/fwa_historical_pilot.py
      - name: Preserve successful station responses even on failed experiment
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fwa-cache
          key: fwa-station-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Store research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fwa-research-evidence
          path: outputs/fwa-pilot/
          retention-days: 90
      - name: Persist execution receipt and held-out scores
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,pathlib,datetime
          p=pathlib.Path("outputs/fwa-pilot/status.json")
          d=json.loads(p.read_text()) if p.exists() else {"status":"failed_before_research"}
          d.update(job_status=os.environ["JOB_STATUS"],run_url=os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],commit=os.environ["GITHUB_SHA"],updated_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          pathlib.Path("receipt.json").write_text(json.dumps(d,indent=2)+"\n")
          PY
          URL="repos/$GITHUB_REPOSITORY/contents/ops/fwa_historical_pilot.json"
          SHA="$(gh api "$URL" --jq .sha 2>/dev/null || true)"
          args=()
          if [ -n "$SHA" ]; then args+=(-f "sha=$SHA"); fi
          gh api --method PUT "$URL" -f message="Record FWA research pilot outcome" -f content="$(base64 -w0 receipt.json)" "${args[@]}" >/dev/null
