name: Verify official WeatherNext 3 access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/weathernext-google-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/726924379374/locations/global/workloadIdentityPools/weather-github/providers/github
          service_account: weather-collector@faroe-weather-benchmark.iam.gserviceaccount.com
          project_id: faroe-weather-benchmark
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-cloud-bigquery
      - name: Verify identity and dataset metadata without scanning data
        run: |
          python - <<'PY'
          from google.cloud import bigquery
          c=bigquery.Client(project='faroe-weather-benchmark',location='US')
          for suffix in ('0p1deg','0p05deg'):
              t=c.get_table('faroe-weather-benchmark.weathernext_3.weathernext_3_0_0_'+suffix)
              print('Metadata access verified:',t.table_id)
          PY
      - name: Verify historical reads with original 100 MB hard limit
        run: |
          python - <<'PY'
          from google.cloud import bigquery
          c=bigquery.Client(project="faroe-weather-benchmark",location="US")
          for suffix in ("0p1deg","0p05deg"):
              sql=f"""SELECT t.init_time, f.time, f.hours, f.temperature_2m_mean,
                ST_X(t.geography) AS lon, ST_Y(t.geography) AS lat
                FROM `faroe-weather-benchmark.weathernext_3.weathernext_3_0_0_{suffix}` t,
                UNNEST(t.forecast) f
                WHERE t.init_time=TIMESTAMP('2026-11-14 00:00:00 UTC')
                AND ST_DWITHIN(t.geography,ST_GEOGPOINT(-6.7647,62.0231),8000)
                AND f.hours=6
                ORDER BY ST_DISTANCE(t.geography,ST_GEOGPOINT(-6.7647,62.0231))
                LIMIT 1"""
              dry=c.query(sql,job_config=bigquery.QueryJobConfig(dry_run=True,use_query_cache=False))
              print(suffix, 'upper-bound bytes:',dry.total_bytes_processed,flush=True)
              if dry.total_bytes_processed is None or dry.total_bytes_processed > 100000000:
                  raise RuntimeError('Data query blocked by safety cap; do not increase without explicit budget approval')
              job=c.query(sql,job_config=bigquery.QueryJobConfig(maximum_bytes_billed=100000000,use_query_cache=False))
              rows=list(job.result())
              if len(rows)!=1 or rows[0].temperature_2m_mean is None:
                  raise RuntimeError("Missing forecast: "+suffix)
              print(suffix, "SUCCESS", "bytes billed:",job.total_bytes_billed)
          PY
