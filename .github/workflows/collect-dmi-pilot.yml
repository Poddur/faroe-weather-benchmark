name: Collect DMI pilot observations (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Get 24h observed values for three research pilot stations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/pilot
          END="$(date -u '+%Y-%m-%dT%H:00:00Z')"
          START="$(date -u -d '25 hours ago' '+%Y-%m-%dT%H:00:00Z')"
          echo "DMI observation pilot UTC window: $START / $END"
          python src/fetch_dmi_observations.py \
            --station-ids 06009 06011 06014 \
            --start "$START" --end "$END" \
            --variables temp_dry wind_speed pressure_at_sea precip_past1h \
            --output data/pilot/dmi_observations_hourly.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          df=pd.read_csv("data/pilot/dmi_observations_hourly.csv",dtype={"station_id":str})
          assert len(df)>0,"No observations returned"
          counts=df.groupby(["station_id","variable"]).size().rename("records").reset_index()
          print(counts.to_string(index=False))
          counts.to_csv("data/pilot/coverage.csv",index=False)
          PY
      - name: Preserve source data and coverage for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmi-pilot-hourly-observations
          path: data/pilot/
          retention-days: 14
